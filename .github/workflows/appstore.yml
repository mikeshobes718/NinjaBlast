name: App Store

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Blast/**"
      - "Blast.xcodeproj/**"
      - "exportOptions.plist"
      - ".github/workflows/appstore.yml"

jobs:
  archive-upload:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcodebuild -showsdks

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys" "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          cp "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"

      - name: Archive
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          KEY="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          xcodebuild \
            -project Blast.xcodeproj \
            -scheme Blast \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Blast.xcarchive" \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM=N7LRRN2YGY \
            archive

      - name: Export and upload
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          KEY="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Blast.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist exportOptions.plist \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER" \
            -allowProvisioningUpdates
