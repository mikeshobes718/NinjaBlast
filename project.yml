name: Blast
options:
  bundleIdPrefix: app.blast
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    DEVELOPMENT_TEAM: N7LRRN2YGY
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Blast:
    type: application
    platform: iOS
    sources:
      - path: Blast
        excludes:
          - "**/.gitkeep"
    postCompileScripts:
      - name: Strip resource xattrs
        script: |
          if [ -n "${TARGET_BUILD_DIR}" ] && [ -d "${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}" ]; then
            xattr -cr "${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}" 2>/dev/null || true
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blast.guide
        PRODUCT_NAME: Blast
        INFOPLIST_KEY_CFBundleDisplayName: Blast
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.food-and-drink
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: N7LRRN2YGY
    info:
      path: Blast/Info.plist
      properties:
        CFBundleDisplayName: Blast
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes:
          - tel
